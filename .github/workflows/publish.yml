name: Publish to NuGet.org

# Publishes via NuGet Trusted Publishing (OIDC) — no long-lived API key stored in the repo.
# https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
#
# One-time setup on nuget.org (profile -> Trusted Publishing -> Create):
#   Repository owner: justdynamics
#   Repository:       Truvio.Commerce.PowerTools
#   Workflow file:    publish.yml
# and a repository secret NUGET_USER holding the nuget.org profile name that CREATED the policy.
# The policy is bound to GitHub environment "production"; the job below declares it.
#
# Release flow: bump <Version> in the csproj, then push a matching tag (e.g. v0.1.0-beta).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # The minimum Dynamicweb version the package binds to. Keep in sync with README ("Requires
  # Dynamicweb 10.8 or newer") and the floor builds referenced throughout docs/.
  DW_FLOOR: 10.8.4

jobs:
  publish:
    runs-on: windows-latest
    environment: production # must match the environment on the nuget.org trusted-publishing policy
    permissions:
      contents: read
      id-token: write # required for OIDC token exchange with nuget.org

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Everything below builds against the verified minimum platform version (the floor): the
      # app then installs on any DW 10.8+ host. A DLL compiled against a newer DW version is
      # silently skipped by older hosts (AddInManager logs "Could not load file or assembly
      # 'Dynamicweb.CoreUI, Version=10.28.1.0'" and the PowerTools area never appears).
      # Hosts 10.23-/10.24- get solid badges / no screen subtitles via feature gates.
      #
      # Test and Pack MUST use the same DynamicwebVersion: MSBuild's incremental build reuses the
      # Release DLL the Test step produced, so a Test at the default (newest) version followed by
      # a Pack at the floor ships a newest-version DLL inside a floor-labelled package. That is
      # exactly what happened for 0.9.1-beta .. 0.11.1-beta. The Verify step is the backstop.
      - name: Test
        run: dotnet test tests/Truvio.Commerce.PowerTools.Tests --configuration Release -p:DynamicwebVersion=${{ env.DW_FLOOR }}

      - name: Pack
        run: dotnet pack src/Truvio.Commerce.PowerTools/Truvio.Commerce.PowerTools.csproj --configuration Release -p:DynamicwebVersion=${{ env.DW_FLOOR }} --output artifacts

      # Reads the assembly references out of the packed DLL and fails the run unless every
      # Dynamicweb.* reference binds to the floor. Never ship a package this step did not pass.
      - name: Verify floor binding
        shell: pwsh
        run: |
          $pkg = Get-ChildItem artifacts -Filter '*.nupkg' | Select-Object -First 1
          ./.github/scripts/verify-floor-binding.ps1 -Package $pkg.FullName -Floor ${{ env.DW_FLOOR }}

      # Exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push artifacts\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
