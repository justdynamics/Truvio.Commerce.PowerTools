name: Build and publish package lines

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        line: [Base, Discount, Groups]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          . ./.github/scripts/package-version.ps1
          [xml]$project = Get-Content 'src/Truvio.Commerce.PowerTools/Truvio.Commerce.PowerTools.csproj'
          $version = Get-LinePackageVersion -Release $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText -Line Base
          if ($env:TAG -ne "v$version") { throw "Tag must be v$version" }
      - name: Test package version guard
        shell: pwsh
        run: ./.github/scripts/test-package-version.ps1
      - name: Build, test, pack and verify floor and add-in version
        shell: pwsh
        run: ./.github/scripts/build-line.ps1 -Line ${{ matrix.line }}
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.line }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: nupkg-*
          merge-multiple: true
          path: artifacts
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      # Backslash on purpose: on a Windows runner dotnet nuget push does not expand a wildcard
      # behind a forward slash and fails with "File does not exist (artifacts/*.nupkg)".
      - name: Push all verified lines
        run: dotnet nuget push artifacts\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nupkg-*
          merge-multiple: true
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.nupkg --clobber
          else
            gh release create "$TAG" artifacts/*.nupkg --verify-tag --generate-notes --title "${TAG#v}" $prerelease
          fi
